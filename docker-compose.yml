# Local test setup that mirrors Railway: pretix + Postgres + Redis + volume,
# plus Mailpit to catch outgoing mail. Not used in production.
#
#   docker compose up --build
#   Shop/Backend: http://localhost:8345/control/   Mails: http://localhost:18025
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: pretix
      POSTGRES_USER: pretix
      POSTGRES_PASSWORD: pretix-local-only
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pretix -d pretix"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7

  mailpit:
    image: axllent/mailpit:v1.33
    ports:
      - "18025:8025"

  pretix:
    build: .
    platform: linux/amd64
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8345:80"
    volumes:
      - pretix-data:/data
    environment:
      PRETIX_PRETIX_INSTANCE_NAME: "S+K Tickets (lokal)"
      PRETIX_PRETIX_URL: "http://localhost:8345"
      PRETIX_PRETIX_CURRENCY: "EUR"
      PRETIX_DJANGO_SECRET: "local-only-not-a-secret"
      PRETIX_DATABASE_BACKEND: "postgresql"
      PRETIX_DATABASE_NAME: "pretix"
      PRETIX_DATABASE_USER: "pretix"
      PRETIX_DATABASE_PASSWORD: "pretix-local-only"
      PRETIX_DATABASE_HOST: "postgres"
      PRETIX_DATABASE_PORT: "5432"
      PRETIX_REDIS_LOCATION: "redis://redis:6379/0"
      PRETIX_REDIS_SESSIONS: "true"
      PRETIX_CELERY_BROKER: "redis://redis:6379/1"
      PRETIX_CELERY_BACKEND: "redis://redis:6379/2"
      PRETIX_MAIL_HOST: "mailpit"
      PRETIX_MAIL_PORT: "1025"
      PRETIX_MAIL_FROM: "kundenservice@skverlag.de"
      PRETIX_ADMIN_EMAIL: "admin@example.com"
      PRETIX_ADMIN_PASSWORD: "local-admin-password"

volumes:
  postgres-data:
  pretix-data:
