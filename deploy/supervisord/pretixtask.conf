; Replaces the official pretixtask.conf. Only change: a fixed number of Celery
; worker processes (CELERY_CONCURRENCY, default 2 from the Dockerfile) instead
; of one per host CPU.
[program:pretixtask]
command=/usr/local/bin/pretix taskworker --concurrency=%(ENV_CELERY_CONCURRENCY)s
autostart=true
autorestart=true
priority=5
user=pretixuser
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
